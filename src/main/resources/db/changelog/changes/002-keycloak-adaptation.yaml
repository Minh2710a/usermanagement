databaseChangeLog:
  - changeSet:
      id: 002-keycloak-user-migration
      author: Minh

      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: keycloak_id
                  type: VARCHAR(255)
                  constraints:
                    unique: true

        - dropColumn:
            tableName: users
            columnName: password