databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: Minh

      changes:
        - createTable:
            tableName: users
            columns:

              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: fullname
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false